name: Test suite

# Reusable gate: every deployment calls this and will not proceed unless all four jobs pass.
# Kept in one file so the API and web deploys cannot drift apart on what "tests passed" means.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit tests (xUnit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: >
          dotnet test tests/WidgetWorks.UnitTests/WidgetWorks.UnitTests.csproj
          --configuration Release --nologo
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ./TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 1

  integration:
    name: Repository integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The Dapper repositories are mostly SQL — the atomic stock reservation, the ON CONFLICT
    # upserts, the cascades. A real server is the only thing that can exercise them, so one runs
    # here. The suite creates and drops its own throwaway database per run.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: widgetworks
          POSTGRES_PASSWORD: replace-me-locally
          POSTGRES_DB: widgetworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U widgetworks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Test
        env:
          WIDGETWORKS_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=widgetworks;Password=replace-me-locally
        run: >
          dotnet test tests/WidgetWorks.IntegrationTests/WidgetWorks.IntegrationTests.csproj
          --configuration Release --nologo
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ./TestResults

      # The HTTP surface itself — routing, model binding, the JWT pipeline, the authorization
      # policies — in process against the same PostgreSQL service.
      - name: API tests (WebApplicationFactory)
        env:
          WIDGETWORKS_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=widgetworks;Password=replace-me-locally
        run: >
          dotnet test tests/WidgetWorks.ApiTests/WidgetWorks.ApiTests.csproj
          --configuration Release --nologo
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ./TestResults
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 1

  coverage:
    name: Backend coverage floor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, integration]

    # Neither suite reaches the floor alone — the repositories are only exercised by the
    # integration tests, the handlers only by the unit tests. The floor applies to the merged
    # figure, so it has to run after both and combine their reports.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: TestResults
          pattern: coverage-*
          merge-multiple: false
      - name: Check the floor
        run: ./scripts/check-coverage.sh ./TestResults 95

  frontend:
    name: Frontend unit tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false
      - name: Install
        run: npm ci --no-audit --no-fund

      # Thresholds live in vitest.config.ts, so this fails the job if coverage regresses.
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build (type-check + bundle)
        run: npm run build

  smoke:
    name: API smoke test (end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false

      - name: Prepare env (placeholder values are valid for CI)
        run: cp .env.example .env

      - name: Start database + API
        run: docker compose up -d --build db api

      - name: Wait for API health
        run: |
          for i in $(seq 1 80); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "API healthy"; exit 0
            fi
            sleep 3
          done
          echo "::error::API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Run smoke test (PowerShell)
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -BaseUrl http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
