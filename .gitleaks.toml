# WidgetWorks — gitleaks configuration (locked down)
# DevSecOps policy: NO secrets, tokens, keys, or connection strings in git.
# The ONLY sanctioned "secret-looking" material is the seeded DEMO account
# credentials (intentionally public so reviewers can log in) and *.example files.
#
# Run locally:   gitleaks detect --config .gitleaks.toml --redact
# Pre-commit:    gitleaks protect --staged --config .gitleaks.toml --redact
# CI enforces this on every push/PR (see .github/workflows/secret-scan.yml).

title = "WidgetWorks gitleaks policy"

# Start from gitleaks' maintained ruleset (AWS, Azure, GCP, Stripe, SendGrid,
# Mailgun, Twilio, JWT, private keys, GitHub/Slack tokens, generic API keys, etc.)
[extend]
useDefault = true

##############################################################################
# Extra project-specific rules (raise signal on OUR concrete secret shapes)
##############################################################################

[[rules]]
id = "widgetworks-stripe-live-key"
description = "Stripe LIVE secret/publishable key (test keys only, never live)"
regex = '''(?i)\b(sk|rk|pk)_live_[0-9a-zA-Z]{16,}\b'''
keywords = ["sk_live_", "rk_live_", "pk_live_"]

[[rules]]
id = "widgetworks-google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''GOCSPX-[0-9A-Za-z_\-]{20,}'''
keywords = ["GOCSPX-"]

[[rules]]
id = "widgetworks-google-oauth-client-id"
description = "Real Google OAuth client ID (never commit — use config/user-secrets)"
# Real IDs look like 123456789012-abcd....apps.googleusercontent.com.
# The '<digits>-' prefix means the 'your-google-client-id...' placeholder does NOT match.
regex = '''\b[0-9]{6,}-[a-z0-9]{16,}\.apps\.googleusercontent\.com\b'''
keywords = ["apps.googleusercontent.com"]

[[rules]]
id = "widgetworks-sendgrid-key"
description = "SendGrid API key"
regex = '''SG\.[A-Za-z0-9_\-]{16,32}\.[A-Za-z0-9_\-]{16,64}'''
keywords = ["SG."]

[[rules]]
id = "widgetworks-smtp-or-email-key"
description = "SMTP / email provider password or API key in config"
regex = '''(?i)"?(smtp[_-]?pass(word)?|mail[_-]?password|email[_-]?api[_-]?key|sendgrid[_-]?api[_-]?key)"?\s*[:=]\s*["']?[^"'\s]{6,}'''
keywords = ["smtp", "mailpassword", "sendgrid", "emailapikey"]

[[rules]]
id = "widgetworks-pg-connection-string"
description = "PostgreSQL connection string with embedded password"
regex = '''(?i)(host|server)=[^;]+;.*password=[^;'"\s]+'''
keywords = ["password="]

  # Loopback only. MigrationRunnerTests points at 127.0.0.1:1 precisely because nothing listens
  # there, so the retry/degrade path can be exercised without a database. A credential that only
  # addresses the local machine grants access to nothing remote. Scoped to this rule and matched
  # against the whole line (the default target is the captured secret, which is why a top-level
  # allowlist entry silently had no effect); a real remote connection string in that same file
  # would still be caught.
  [rules.allowlist]
  regexTarget = "line"
  regexes = [
    '''(?i)(host|server)=(127\.0\.0\.1|localhost|::1)\b''',
    # A "password" whose value is literally an ellipsis is a format example, not a credential.
    # Earlier commits of infra/Provision.ps1 printed one as prompt help; the script now lists the
    # keys instead, but CI scans full history, so the pattern has to stay recognised.
    '''(?i)password=(\.\.\.|…)''',
  ]

[[rules]]
id = "widgetworks-jwt-signing-key"
description = "Hard-coded JWT signing key in config"
regex = '''(?i)"(Jwt|Token)(Signing)?(Key|Secret)"\s*:\s*"[^"]{16,}"'''
keywords = ["SigningKey", "JwtKey", "TokenSecret"]

##############################################################################
# Allowlist — the DevSecOps exception: intentional, non-sensitive demo material
##############################################################################
[allowlist]
description = "Intentional demo/seed material and example placeholders"

# Files that are allowed to contain 'secret-looking' demo values
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)README\.md$''',
  '''(^|/)docs/.*\.md$''',
  # Seed migration scripts that create the demo admin + demo customer
  '''src/WidgetWorks\.Infrastructure/Migrations/.*[Ss]eed.*\.sql$''',
  # End-to-end smoke test uses throwaway demo credentials by design
  '''(^|/)scripts/smoke-test\.ps1$''',
  '''(^|/)example\.bicepparam$''',
  '''(^|/)serilog\.example\.json$''',
]

# Known demo values (documented in README) — the sanctioned exception.
# These are throwaway credentials for the local demo ONLY.
regexes = [
  '''admin@widgetworks\.demo''',
  '''demo@widgetworks\.demo''',
  '''(?i)DemoAdmin!Change[0-9]{2,}''',   # placeholder demo admin password pattern
  '''(?i)DemoUser!Change[0-9]{2,}''',    # placeholder demo customer password pattern
  # Stripe & Google PUBLISHED test placeholders (safe, non-live)
  '''pk_test_[0-9a-zA-Z]{10,}''',
  '''sk_test_00000000000000EXAMPLE''',
  '''your-google-client-id\.apps\.googleusercontent\.com''',
  # Throwaway HMAC key used only in unit tests (JwtTokenServiceTests/JwtKeyRingTests) — not a secret.
  '''(?i)test-signing-key[a-z0-9\-]*''',
]

# Placeholder tokens used in *.example files
stopwords = [
  "changeme",
  "example",
  "placeholder",
  "your-",
  "xxxxxxxx",
  "replace-me",
]
