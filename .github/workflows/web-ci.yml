name: Web CI

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']
  pull_request:
    branches: [main]
    paths: ['web/**', '.github/workflows/web-ci.yml']

  # On demand, and this one needs it most: the paths filter means a change outside web/ never
  # runs it, so it can sit unexercised for long stretches with nothing reporting that. No paths
  # filter on the manual trigger — the point of pressing it is to run regardless.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build web (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Public build-time config, injected from GitHub Actions Variables (never committed).
      # The Google client id is public (safe in the bundle); no secrets are used in the web build.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false
      - name: Node version (preinstalled on the runner)
        run: node --version && npm --version
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests (Vitest)
        run: npm test
      - name: Build (type-check + bundle)
        run: npm run build
