name: Dependabot auto-merge

# Turns on GitHub's native auto-merge for Dependabot pull requests, so a PR whose
# every required status check passes merges itself instead of waiting for a human.
# Branch protection still fully gates the merge — nothing red lands, and required
# checks/reviews are still enforced.
#
# Scope: minor and patch updates only. Major bumps are left open for a human to read
# the changelog first. Uses only the automatic GITHUB_TOKEN — no PAT or extra secrets.
# Requires "Allow auto-merge" in Settings > General (enabled for this repo).

on: pull_request

# Read-only by default; the one job that needs it grants itself the minimum below.
permissions:
  contents: read

jobs:
  auto-merge:
    # The PR's author, not github.actor. github.actor is whoever caused this event,
    # so any workflow that pushes to a Dependabot branch — a lock-file regeneration,
    # say — makes the following synchronize run skip this job, and auto-merge is
    # never enabled for exactly the PRs that needed the extra push.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scoped to the job, not the workflow, so the workflow default stays read-only.
    #
    # contents: write is required, not optional: `gh pr merge --auto` calls the
    # enablePullRequestAutoMerge mutation, which GitHub gates on contents: write
    # even though GitHub performs the merge itself later. Dropping it for
    # least-privilege reasons made this job fail on every Dependabot PR with
    # "Resource not accessible by integration".
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
