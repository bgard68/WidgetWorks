name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (CLI — MIT, no license needed)
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner --exit-code 1

  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # BOOTSTRAP: scaffold was authored without a local SDK. Run `dotnet format`
      # locally once, then set continue-on-error back to false to re-enable the gate.
      - name: Verify formatting
        continue-on-error: true
        run: dotnet format --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Requires Dependency Graph / GitHub Advanced Security on private repos; run only when public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
