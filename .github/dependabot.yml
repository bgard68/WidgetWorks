# Dependabot — automated dependency & security updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-reference
version: 2

updates:
  # ---- .NET / NuGet (solution root) ----
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies", "dotnet"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    groups:
      dotnet-production:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      dotnet-development:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      dotnet-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- React / npm (SPA) ----
  - package-ecosystem: "npm"
    directory: "/src/WidgetWorks.Web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    groups:
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- GitHub Actions (CI workflows) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
    groups:
      actions-all:
        patterns: ["*"]

  # ---- Docker (Compose images) ----
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build(docker)"
      include: "scope"
    groups:
      docker-all:
        patterns: ["*"]
