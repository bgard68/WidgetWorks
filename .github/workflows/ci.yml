name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'scripts/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The repository suite talks to a real PostgreSQL: the atomic stock reservation and the
    # schema constraints cannot be exercised by an in-memory fake. Running it here means every
    # PR proves it, not just a deployment.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: widgetworks
          POSTGRES_PASSWORD: replace-me-locally
          POSTGRES_DB: widgetworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U widgetworks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes with the job token; keep it out of .git/config.
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      # Enforced. The bootstrap exemption is spent: the tree was formatted once a local SDK was
      # available, so a formatting drift is now a build failure rather than a warning nobody reads.
      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        env:
          WIDGETWORKS_TEST_DB: Host=localhost;Port=5432;Database=postgres;Username=widgetworks;Password=replace-me-locally
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage" --settings coverlet.runsettings
          --results-directory ./TestResults

      - name: Coverage floor
        run: ./scripts/check-coverage.sh ./TestResults 95

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Requires Dependency Graph / GitHub Advanced Security on private repos; run only when public.
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    # Read-only on purpose: the PR-comment summary needed pull-requests: write, so the results
    # go to the run's step summary instead and the job token stays read-only.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
