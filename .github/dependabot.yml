# Dependabot — automated dependency & security updates.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-reference
version: 2

updates:
  # ---- .NET / NuGet (solution root) ----
  # Dependabot has no production/development split for NuGet, so the options that
  # depend on one are rejected here: commit-message.prefix-development and
  # groups.*.dependency-type are documented for bundler, composer, mix, maven,
  # npm and pip only. They were added on 2026-08-07 together with
  # versioning-strategy and invalidated the whole file, not just this block --
  # Dependabot fell back to the last configuration that parsed and stayed there,
  # which is why the codeql-action grouping added on 2026-08-24 never took effect
  # and init/analyze kept arriving as split, unmergeable pull requests.
  # Keep this block to options NuGet actually supports.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "dotnet"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One grouped pull request for minor and patch, matching what the
      # production/development pair was reaching for without dependency-type.
      dotnet-version-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      dotnet-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi >=2.7.5 <3.0.0.
      # A 3.x bump resolves outside that constraint, raising NU1608 -> build error
      # (TreatWarningsAsErrors). We still take 2.x patches, which is what the
      # explicit pin in WidgetWorks.WebApi.csproj exists for (GHSA-v5pm-xwqc-g5wc).
      # Revisit when ASP.NET Core itself depends on Microsoft.OpenApi 3.x.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]

  # ---- React / npm (SPA) ----
  # The SPA lives in /web. This said /src/WidgetWorks.Web, a path that has not
  # existed since the frontend moved, so every weekly npm run failed and no
  # version update was ever proposed for it -- the groups below included.
  # Security updates still arrived, because Dependabot finds those through the
  # dependency graph rather than this directory, which is why the block looked
  # half-alive rather than dead. check-dependabot-config.py now asserts that
  # every configured directory exists.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # Groups are matched in order, so these two families come before the
      # production/development split below -- the same reasoning the
      # github-actions block already records for codeql-action.
      #
      # Both families version-lock across packages, so a split pull request
      # cannot install: @vitest/coverage-v8 declares an exact `peer vitest`,
      # and @types/react-dom requires the matching major of @types/react.
      # Dependabot proposed each half separately on 2026-10-30 (#23, #25, #26,
      # #27) and all four failed `npm install` on a constraint the other half
      # would have satisfied. Neither group restricts update-types, because the
      # split that broke here was a major on both sides -- a group that stops
      # at minor and patch would have let exactly this case through again.
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      npm-production:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
      npm-development:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # ---- GitHub Actions (CI workflows) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Groups are matched in order; these must come before the catch-all.
      # Both families are version-locked across call sites, so a split PR
      # lands a mismatch that only fails at run time:
      #   codeql-action/init + /analyze must share one version, else
      #     "Loaded a configuration file for version X, but running version Y".
      #   upload-artifact + download-artifact must stay on the same major,
      #     or the upload/download handoff in test-suite.yml breaks.
      codeql-action:
        patterns: ["github/codeql-action*"]
      artifact-actions:
        patterns: ["actions/upload-artifact", "actions/download-artifact"]
      actions-all:
        patterns: ["*"]

  # ---- Docker (Compose images) ----
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "build(docker)"
    groups:
      docker-all:
        patterns: ["*"]
